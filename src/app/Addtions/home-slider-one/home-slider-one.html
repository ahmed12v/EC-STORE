<div class="container mt-3">
    <div class="row">
       <div class="col-12">
          <div class="items-slid">
            <owl-carousel-o [options]="customOptions">
  <ng-template carouselSlide *ngFor="let img of images; let i = index" [id]="'slide-'+i">
    <img [src]="img" [alt]="'photo ' + (i+1)" width="100%" class="imge">
  </ng-template>

  <!-- custom dots -->
  <ng-template carouselDots>
    <div class="custom-dots">
      
      <span *ngFor="let img of images; let i = index" 
            class="dot" 
            >
        <img [src]="img" alt="preview" width="50">
      </span>
    </div>
  </ng-template>
</owl-carousel-o>
           
          </div>
       </div>
    </div>
</div>
