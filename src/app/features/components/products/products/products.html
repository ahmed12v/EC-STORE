@if (loadSpinner()) {
    <div class="d-flex justify-content-center align-items-center vh-100">
      <i class="fa-spin fa-spinner fa-solid fs-3 spin-color"></i>
    </div>
}
<section class="allproduct-section mb-5">
<div class="container mt-4 mb-3">
       <h1>
        All Product:
       </h1>
        <div class="w-100 p-5 d-flex justify-content-center">
            <input [(ngModel)]="userWord" type="search" class="w-75 input-serch" placeholder="serch by name...">
        </div>
        
        <div class="row gy-3">
            @for (card of allProuduct() | serchPipe : userWord(); track $index) {
                <div class="col-lg-3 col-sm-6" appScrollReveal>
               <div class="product-item cursor-pointer" [routerLink]="['/prouductDeteils',card._id]">
                <div class="prouduct-img w-100 d-flex justify-content-center align-items-center">
                  <img [src]="card.imageCover" alt="">
                </div>
                <div class="product-items pt-3">
                 <p class="cato-name p-0 m-0"> {{card.category.name}} </p>
                 <p class="proud-name p-0 mt-1"> {{card.title.slice(0,12)}} </p>
                </div>
                <div class="price-rating d-flex mt-1">
                 <p class="price"> {{card.price}} EGP </p>
                 <p class="ms-auto text-black"> <span class="ratin-icon"> <i class="fa-solid fa-star"></i> </span> {{card.ratingsAverage}}  </p>
                </div>
                <button class="w-100 AddCrt-btn"> <i class="fa-solid fa-cart-shopping"></i>  Add </button>
               </div>
            </div>
            }
            
        </div>
    
    </div>
</section>
