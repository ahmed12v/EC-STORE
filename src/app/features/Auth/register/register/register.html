<section class="registration">
    <div class="container  p-0">
      <div class="row d-flex align-items-center">
           <div class="col-md-6 phot-div">
            <div class="register-Photo">
                <h1>
                    Dress up, <br>
                   <span> stand out </span> 
                </h1>
            </div>
           </div>
           <div class="col-md-6">
            <div class="register-form ps-5 pe-5">
                <div class="register-tittle mb-5">
                    <h1>
                        Sign Up
                    </h1>
                </div>
                <form>
                    <div class="name-inputs d-flex gap-3">
                 <div class="mb-3 w-50">
                 <label for="fullName" class="form-label">Full Name</label>
                 <input type="text" class="form-control bg-transparent name"  id="fullName" required>
                 </div>
                 <div class="mb-3 w-50">
                 <label for="phone" class="form-label">Phone</label>
                 <input type="tel" class="form-control bg-transparent name" id="lastName" required>
                 </div>
                    </div>
                    <div class="mb-3 ">
                 <label for="lastName" class="form-label">Email Address</label>
                 <input type="email" class="form-control bg-transparent name" id="lastName" required>
                 </div>

                 <div class="mb-3 ">
                 <label for="lastName" class="form-label">Password</label>
                 <input type="password" class="form-control bg-transparent name" id="lastName" required>
                 </div>

                 <div class="mb-3 ">
                 <label for="lastName" class="form-label">Re-Password</label>
                 <input type="password" class="form-control bg-transparent name" id="lastName" required>
                 </div>
                <p class="m-0 p-0 already-have-acount">
                    Already have an account? <span routerLink="/login">Login</span>
                </p>
                 <button  class="w-100 mt-3 rounded-3 pt-2 pb-2 Sign-btn">
                  Sign Up
                 </button>
                </form>
            </div>
           </div>
      </div>
    </div>
</section>
